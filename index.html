<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบค้นหาและเปรียบเทียบสินค้า</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md shadow-blue-200">
          🔍
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">ระบบเปรียบเทียบสินค้า</h1>
          <p class="text-xs text-slate-500">วิเคราะห์ข้อมูลอัตโนมัติด้วย Gemini Vision</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

    <!-- Search / Filter Card -->
    <section class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
      <form id="searchForm" class="space-y-4">
        <div class="flex flex-col md:flex-row gap-4">
          <div class="flex-1">
            <label for="searchInput" class="block text-sm font-semibold text-slate-700 mb-1">คำค้นหา หรือชื่อรุ่นสินค้า</label>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="เช่น Wacoal Wireless Bra บราไร้โครง รุ่น WB3A14"
              class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all text-sm"
            >
          </div>
          <div class="w-full md:w-auto flex items-end">
            <button 
              type="submit" 
              id="searchBtn"
              class="w-full md:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl shadow-md shadow-blue-200 transition-all flex items-center justify-center gap-2 text-sm"
            >
              <span>🔍 ค้นหาและเปรียบเทียบ</span>
            </button>
          </div>
        </div>

        <!-- Image Upload Section -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">แนบรูปภาพสินค้า (Optional)</label>
          <input 
            type="file" 
            id="imageInput" 
            accept="image/*"
            class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer"
          >
        </div>
      </form>
    </section>

    <!-- Status / Loading Banner -->
    <div id="statusMessage" class="hidden text-center py-8">
      <div class="inline-flex items-center gap-3 px-5 py-3 rounded-xl bg-blue-50 text-blue-700 font-medium text-sm">
        <svg class="animate-spin h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>กำลังวิเคราะห์และค้นหาข้อมูลเปรียบเทียบจากเว็บออนไลน์จริง...</span>
      </div>
    </div>

    <!-- Results Section -->
    <section>
      <div id="resultHeader" class="hidden flex items-center justify-between mb-6">
        <h2 class="font-bold text-xl text-slate-900">ผลการเปรียบเทียบจากเว็บออนไลน์จริง</h2>
        <span id="resultCount" class="bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1 rounded-full">
          พบ 0 รายการ
        </span>
      </div>

      <!-- Results Grid -->
      <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- JS จะสร้างการ์ดสินค้าตรงนี้ -->
      </div>
    </section>

  </main>

  <!-- JavaScript -->
  <script>
    // ** ใส่ URL ของ Google Apps Script Web App ของคุณที่นี่ **
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtcpRhVc6J6X2QKAAWsaSPrn_uBUKDddS340y3sePPlYf9PFKpi5S2uccS8239iwGLUw/exec"; 

    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const imageInput = document.getElementById('imageInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusMessage = document.getElementById('statusMessage');
    const resultHeader = document.getElementById('resultHeader');
    const resultCount = document.getElementById('resultCount');
    const resultsGrid = document.getElementById('resultsGrid');

    searchForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      const file = imageInput.files[0];

      if (!query && !file) {
        alert('กรุณากรอกคำค้นหาหรือเลือกรูปภาพสินค้าอย่างใดอย่างหนึ่ง');
        return;
      }

      showLoading(true);

      try {
        let base64Image = null;
        if (file) {
          base64Image = await convertFileToBase64(file);
        }

        const payload = {
          query: query,
          image: base64Image
        };

        const response = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const resData = await response.json();

        if (resData.status === 'success') {
          renderResults(resData.data);
        } else {
          alert('เกิดข้อผิดพลาดจากระบบ: ' + resData.message);
        }
      } catch (err) {
        console.error(err);
        alert('เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์');
      } finally {
        showLoading(false);
      }
    });

    function convertFileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    function showLoading(isLoading) {
      if (isLoading) {
        statusMessage.classList.remove('hidden');
        searchBtn.disabled = true;
        searchBtn.classList.add('opacity-50', 'cursor-not-allowed');
      } else {
        statusMessage.classList.add('hidden');
        searchBtn.disabled = false;
        searchBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    function renderResults(items) {
      resultsGrid.innerHTML = '';
      
      if (!items || items.length === 0) {
        resultHeader.classList.add('hidden');
        resultsGrid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">ไม่พบข้อมูลเปรียบเทียบ</div>`;
        return;
      }

      resultHeader.classList.remove('hidden');
      resultCount.textContent = `พบ ${items.length} รายการ`;

      items.forEach(item => {
        // รูปภาพสำรองกรณีไม่มี URL หรือโหลดรูปภาพไม่สำเร็จ
        const defaultImage = "https://images.unsplash.com/photo-1583496661160-fb5886a0aaaa?auto=format&fit=crop&w=600&q=80";
        const imgUrl = item.imageUrl || defaultImage;

        const cardHtml = `
          <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
            <div>
              <!-- ส่วนรูปภาพสินค้า -->
              <div class="relative w-full h-48 bg-slate-100 overflow-hidden">
                <img 
                  src="${imgUrl}" 
                  alt="${item.title}" 
                  class="w-full h-full object-cover" 
                  onError="this.onerror=null;this.src='${defaultImage}';"
                >
                <span class="absolute top-3 left-3 text-xs font-bold text-blue-600 uppercase tracking-wider bg-white/90 backdrop-blur-sm px-3 py-1 rounded-lg shadow-sm">
                  ${item.brand}
                </span>
                <span class="absolute top-3 right-3 bg-emerald-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">
                  ${item.matchScore || 'N/A'}
                </span>
              </div>

              <!-- รายละเอียดสินค้า -->
              <div class="p-5 space-y-3">
                <h4 class="font-bold text-slate-900 text-base leading-snug">
                  ${item.title}
                </h4>
                
                <div class="text-lg font-bold text-slate-800">
                  💰 ${item.price}
                </div>

                <div class="bg-amber-50 text-amber-900 p-2.5 rounded-xl text-xs font-medium border border-amber-200/60 flex items-start gap-1.5">
                  <span class="flex-shrink-0">⭐</span>
                  <span>${item.promo}</span>
                </div>

                <p class="text-xs text-slate-600 leading-relaxed pt-1">
                  ${item.details}
                </p>
              </div>
            </div>

            <!-- Footer ของการ์ด -->
            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 text-right">
              <span class="text-xs font-medium text-slate-400">วิเคราะห์ข้อมูลผ่าน Gemini Vision</span>
            </div>
          </div>
        `;
        resultsGrid.innerHTML += cardHtml;
      });
    }
  </script>
</body>
</html>
