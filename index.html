<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-blue-500/20">
          VS
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-tight">Product Intelligence System</h1>
          <p class="text-xs text-slate-500 hidden sm:block">ดึงสินค้าจริงจากเว็บแบรนด์ แล้วให้ Gemini เทียบจากรูป</p>
        </div>
      </div>
      <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
        ระบบพร้อมใช้งาน
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- Search Section -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 sm:p-7">
      <div class="border-b border-slate-100 pb-4 mb-6">
        <h2 class="text-base sm:text-lg font-bold text-slate-900 flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          ระบุคำค้นหา หรือ อัปโหลดรูปภาพเพื่อค้นหา
        </h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <!-- Input Text & Image Upload -->
        <div class="space-y-3">
          <label class="block text-xs font-semibold text-slate-700">พิมพ์ชื่อสินค้า / คุณลักษณะที่ต้องการค้นหา</label>
          <div class="relative flex items-center">
            <input type="text" id="searchInput" placeholder="เช่น Wacoal Wireless Bra บราไร้โครง รุ่น WB3A14" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-3.5 pr-12 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
            
            <label for="imageUpload" class="absolute right-2 p-1.5 bg-slate-200/60 hover:bg-slate-300 text-slate-600 rounded-lg cursor-pointer transition-all" title="อัปโหลดรูปภาพเพื่อค้นหา">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </label>
            <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
          </div>

          <div id="imagePreviewContainer" class="hidden flex items-center justify-between bg-blue-50/70 border border-blue-200 rounded-xl p-2.5">
            <div class="flex items-center space-x-3">
              <img id="imagePreview" src="" alt="Selected Preview" class="w-12 h-12 object-cover rounded-lg border border-slate-200">
              <div>
                <p id="imageFileName" class="text-xs font-semibold text-slate-800 truncate max-w-[180px] sm:max-w-[250px]">filename.jpg</p>
                <p class="text-[10px] text-blue-600 font-medium">แนบรูปภาพแล้ว (ระบบจะวิเคราะห์ด้วย Gemini Vision)</p>
              </div>
            </div>
            <button onclick="removeSelectedImage()" class="p-1 hover:bg-blue-100 text-slate-400 hover:text-rose-500 rounded-lg transition-all" title="ยกเลิกรูปนี้">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>

        <!-- Preset Categories -->
        <div class="space-y-3">
          <label class="block text-xs font-semibold text-slate-700">หรือ เลือกหมวดหมู่สำเร็จรูป</label>
          <select id="categorySelect" onchange="applyCategory()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all cursor-pointer">
            <option value="">-- เลือกจากหมวดหมู่ --</option>
            <option value="บราไร้โครง Wireless Bra">บราไร้โครง Wireless Bra</option>
            <option value="ชุดชั้นในกระชับสัดส่วน Seamless">ชุดชั้นในกระชับสัดส่วน Seamless</option>
            <option value="สปอร์ตบราผ้าระบายอากาศ">สปอร์ตบราผ้าระบายอากาศ</option>
          </select>
        </div>
      </div>

      <div class="mt-6 flex justify-end">
        <button onclick="executeRealSearch()" class="w-full sm:w-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white rounded-xl font-semibold text-sm shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          ค้นหา & วิเคราะห์ข้อมูลสินค้า
        </button>
      </div>
    </section>

    <!-- Results Section -->
    <section id="comparisonSection" class="space-y-5 hidden">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3">
        <div>
          <h2 class="text-base sm:text-lg font-bold text-slate-900">ผลเปรียบเทียบสินค้าคู่แข่ง (ข้อมูลจริงจากเว็บแบรนด์)</h2>
          <p class="text-xs text-slate-500 mt-0.5" id="searchKeywordLabel">ผลลัพธ์การค้นหา</p>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-end">
          <div class="inline-flex rounded-lg border border-slate-200 bg-white p-0.5 text-xs font-semibold" role="group" aria-label="รูปแบบการแสดงผล">
            <button id="modeBest" onclick="setViewMode('best')" class="px-3 py-1 rounded-md">แบรนด์ละ 1 รุ่น</button>
            <button id="modeAll" onclick="setViewMode('all')" class="px-3 py-1 rounded-md">แสดงทั้งหมด</button>
          </div>
          <span id="resultCount" class="text-xs font-semibold bg-slate-200/80 text-slate-700 px-3 py-1 rounded-full">พบ 0 รายการ</span>
        </div>
      </div>

      <div id="comparisonGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Cards will be populated here -->
      </div>
    </section>

  </main>

  <script>
    // ⚠️ นำ Web App URL จาก Google Apps Script มาวางแทนที่ตรงนี้
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxtcpRhVc6J6X2QKAAWsaSPrn_uBUKDddS340y3sePPlYf9PFKpi5S2uccS8239iwGLUw/exec";

    let selectedBase64Image = null;

    function applyCategory() {
      const selected = document.getElementById("categorySelect").value;
      if (selected) {
        document.getElementById("searchInput").value = selected;
      }
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 448; // ย่อรูปอ้างอิงก่อนส่ง → อัปโหลดและวิเคราะห์เร็วขึ้น (พอสำหรับดูทรง)
            const scaleSize = MAX_WIDTH / img.width;
            
            if (scaleSize < 1) {
              canvas.width = MAX_WIDTH;
              canvas.height = img.height * scaleSize;
            } else {
              canvas.width = img.width;
              canvas.height = img.height;
            }

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            selectedBase64Image = canvas.toDataURL('image/jpeg', 0.75);
            document.getElementById("imagePreview").src = selectedBase64Image;
            document.getElementById("imageFileName").innerText = file.name;
            document.getElementById("imagePreviewContainer").classList.remove("hidden");
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function removeSelectedImage() {
      selectedBase64Image = null;
      document.getElementById("imageUpload").value = "";
      document.getElementById("imagePreviewContainer").classList.add("hidden");
    }

    const MIN_BRANDS = 6;
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const baht = n => "฿" + Number(n).toLocaleString("en-US");
    // รูปบนการ์ดใช้ขนาดย่อจาก CDN ที่รองรับ → หน้าเว็บโหลดเร็วขึ้น
    const displayImg = u => (u && /image\.uniqlo\.com|cdn\.shopify\.com|\/cdn\/shop\//i.test(u) && !/[?&]width=/.test(u))
      ? u + (u.includes("?") ? "&" : "?") + "width=600" : u;

    let searchSeq = 0; // กันผลของการค้นหาเก่าทับการค้นหาใหม่

    // ปลุก Apps Script ตั้งแต่เปิดหน้า (ลดเวลารอเซิร์ฟเวอร์เริ่มทำงานตอนกดค้นหาจริง)
    window.addEventListener("load", () => {
      if (GAS_API_URL && !GAS_API_URL.includes("YOUR_DEPLOYMENT_ID"))
        fetch(GAS_API_URL + "?ping=1").then(r => r.json()).then(j => console.log("Apps Script version", j.version)).catch(() => {});
    });

    // จำผลค้นหาในเบราว์เซอร์: ค้นซ้ำด้วยรูป/ข้อความเดิม → แสดงทันทีไม่ต้องรอ (เก็บ 6 ชม.)
    const CLIENT_CACHE_MS = 6 * 60 * 60 * 1000;
    const memCache = new Map();
    function cacheKey(q, img) {
      let h = 0; const s = (q || "") + "|" + (img || "");
      for (let i = 0; i < s.length; i += 7) h = (h * 31 + s.charCodeAt(i)) | 0; // เร็ว: สุ่มทุก 7 ตัวอักษร
      return "pis_" + s.length + "_" + h;
    }
    function cacheGet(k) {
      const m = memCache.get(k); if (m && Date.now() - m.t < CLIENT_CACHE_MS) return m.v;
      try { const x = JSON.parse(sessionStorage.getItem(k) || "null"); if (x && Date.now() - x.t < CLIENT_CACHE_MS) return x.v; } catch (e) {}
      return null;
    }
    function cacheSet(k, v) {
      memCache.set(k, { t: Date.now(), v: v });
      try { sessionStorage.setItem(k, JSON.stringify({ t: Date.now(), v: v })); } catch (e) {}
    }

    async function callApi(payload) {
      const response = await fetch(GAS_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const raw = await response.text();
      let result;
      try { result = JSON.parse(raw); }
      catch (e) {
        const txt = raw.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, " ")
                       .replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 300);
        throw new Error("Apps Script ไม่ได้ตอบกลับเป็น JSON (HTTP " + response.status + "): " + (txt || "ไม่มีข้อความ") +
          " — ให้เปิด Apps Script → Executions เพื่อดู error จริง หรือตรวจว่า Deploy เป็น New version และตั้ง Who has access = Anyone แล้ว");
      }
      if (result.status !== "success") throw new Error(result.message || "เกิดข้อผิดพลาดในการดึงข้อมูล");
      return result;
    }

    function cardHtml(item) {
      const fallbackImg = `https://placehold.co/600x400/f1f5f9/475569?text=${encodeURIComponent(item.brand)}`;
      const scoreColor = item.matchScore >= 80 ? "bg-emerald-500" : item.matchScore >= 60 ? "bg-amber-500" : "bg-slate-400";
      const oldPrice = item.compareAt ? `<span class="text-sm text-slate-400 line-through ml-2">${baht(item.compareAt)}</span>
          <span class="text-xs font-bold text-rose-600 ml-1">-${item.discountPct}%</span>` : "";
      const promo = item.promoName ? esc(item.promoName) : (item.compareAt ? "ลดราคาจากราคาปกติ" : "ไม่พบโปรโมชั่นเฉพาะรุ่น");
      return `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
          <div>
            <div class="relative w-full h-64 bg-slate-100 overflow-hidden border-b border-slate-100">
              <img src="${esc(displayImg(item.imageUrl))}" alt="${esc(item.title)}" referrerpolicy="no-referrer" loading="lazy"
                   class="w-full h-full object-contain p-2 hover:scale-105 transition-transform duration-300"
                   onerror="this.onerror=null;this.src='${fallbackImg}';">
              <span class="absolute top-3 left-3 text-xs font-bold text-blue-600 uppercase tracking-wider bg-white/90 px-3 py-1 rounded-lg shadow-sm border border-slate-200">${esc(item.brand)}</span>
              <span class="absolute top-3 right-3 ${scoreColor} text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-sm">ใกล้เคียง ${item.matchScore}%</span>
              ${item.imageScore != null ? `<span class="absolute bottom-3 right-3 bg-white/90 text-slate-700 text-[11px] font-semibold px-2 py-0.5 rounded-lg border border-slate-200">🖼 รูป ${item.imageScore}% · 📝 รายละเอียด ${item.textScore ?? "-"}%</span>` : ""}
            </div>
            <div class="p-5 space-y-3">
              <h4 class="font-bold text-slate-900 text-base leading-snug">${esc(item.title)}</h4>
              <p class="text-xs text-slate-500">รหัส: ${esc(item.code || "-")}</p>
              <div class="text-lg font-bold text-slate-800">${esc(item.priceText)}${oldPrice}</div>
              <div class="bg-amber-50 text-amber-900 p-2.5 rounded-xl text-xs font-medium border border-amber-200/60">⭐ ${promo}</div>
              ${item.similar ? `<p class="text-xs text-slate-700"><b>เหมือน:</b> ${esc(item.similar)}</p>` : ""}
              ${item.different ? `<p class="text-xs text-slate-700"><b>ต่าง:</b> ${esc(item.different)}</p>` : ""}
            </div>
          </div>
          <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
            <span class="text-xs text-slate-400">ข้อมูลจาก ${esc(item.source)}</span>
            <a href="${esc(item.url)}" target="_blank" rel="noopener" class="text-xs font-semibold text-blue-600 hover:underline">ดูหน้าสินค้า →</a>
          </div>
        </div>`;
    }

    // ---------- โหมดแสดงผล: แบรนด์ละ 1 รุ่น / แสดงทั้งหมด (จำไว้ในเบราว์เซอร์) ----------
    let viewMode = "best", lastResult = null;
    try { viewMode = localStorage.getItem("pis_view") === "all" ? "all" : "best"; } catch (e) {}
    function paintToggle() {
      const on = "px-3 py-1 rounded-md bg-blue-600 text-white", off = "px-3 py-1 rounded-md text-slate-600 hover:bg-slate-100";
      document.getElementById("modeBest").className = viewMode === "best" ? on : off;
      document.getElementById("modeAll").className = viewMode === "all" ? on : off;
    }
    function setViewMode(m) {
      viewMode = m; paintToggle();
      try { localStorage.setItem("pis_view", m); } catch (e) {}
      if (lastResult) renderResult(lastResult);
    }
    window.addEventListener("DOMContentLoaded", paintToggle);

    function renderResult(r) {
      lastResult = r;
      if (viewMode === "all" && (r.all || []).length) renderAll(r.all, r.warnings || [], r.coverage || []);
      else render(r.data || [], r.warnings || [], r.coverage || []);
    }

    /** การ์ดเล็กสำหรับรุ่นอื่นของแบรนด์เดียวกัน */
    function miniCardHtml(item) {
      const fallbackImg = `https://placehold.co/300x300/f1f5f9/475569?text=${encodeURIComponent(item.brand)}`;
      const scoreColor = item.matchScore >= 80 ? "bg-emerald-500" : item.matchScore >= 60 ? "bg-amber-500" : "bg-slate-400";
      return `
        <a href="${esc(item.url)}" target="_blank" rel="noopener" class="bg-white rounded-xl border border-slate-200 overflow-hidden hover:shadow-md transition-all flex flex-col">
          <div class="relative w-full h-40 bg-slate-100">
            <img src="${esc(displayImg(item.imageUrl))}" alt="${esc(item.title)}" referrerpolicy="no-referrer" loading="lazy"
                 class="w-full h-full object-contain p-2" onerror="this.onerror=null;this.src='${fallbackImg}';">
            <span class="absolute top-2 right-2 ${scoreColor} text-white text-[11px] font-bold px-2 py-0.5 rounded-full">${item.matchScore}%</span>
          </div>
          <div class="p-3 space-y-1">
            <p class="text-xs font-semibold text-slate-900 leading-snug">${esc(item.title)}</p>
            <p class="text-xs font-bold text-slate-800">${esc(item.priceText)}${item.compareAt ? ` <span class="text-slate-400 line-through font-normal">${baht(item.compareAt)}</span>` : ""}</p>
            ${item.imageScore != null ? `<p class="text-[11px] text-slate-500">🖼 รูป ${item.imageScore}% · 📝 ${item.textScore ?? "-"}%</p>` : ""}
          </div>
        </a>`;
    }

    /** โหมดแสดงทั้งหมด: จัดกลุ่มตามแบรนด์ รุ่นที่ใกล้ที่สุดเป็นการ์ดใหญ่ ที่เหลือเป็นการ์ดเล็ก */
    function renderAll(all, warnings, coverage) {
      const grid = document.getElementById("comparisonGrid");
      const groups = {};
      all.forEach(x => (groups[x.brand] = groups[x.brand] || []).push(x));
      const brands = Object.keys(groups).sort((a, b) => groups[b][0].matchScore - groups[a][0].matchScore);
      document.getElementById("resultCount").innerText = `พบ ${all.length} รุ่น จาก ${brands.length} แบรนด์`;
      const html = brands.map(b => {
        const list = groups[b].slice().sort((x, y) => (y.isBest - x.isBest) || (y.matchScore - x.matchScore));
        const [top, ...rest] = list;
        return `
          <div class="col-span-1 md:col-span-2 lg:col-span-3 flex items-center gap-2 pt-2">
            <h3 class="text-sm font-bold text-slate-900">${esc(b)}</h3>
            <span class="text-xs text-slate-500">${list.length} รุ่น</span>
            <div class="flex-1 border-t border-slate-200"></div>
          </div>
          ${cardHtml(top)}
          ${rest.length ? `<div class="col-span-1 md:col-span-1 lg:col-span-2 grid grid-cols-2 lg:grid-cols-3 gap-3 content-start">${rest.map(miniCardHtml).join("")}</div>` : ""}`;
      }).join("");
      grid.innerHTML = html + coverageHtml(coverage) + warningsHtml(warnings);
    }

    function coverageHtml(coverage) {
      return (coverage || []).length ? `
        <div class="col-span-1 md:col-span-2 lg:col-span-3 bg-white border border-slate-200 rounded-xl p-3 text-xs text-slate-600">
          <b>แบรนด์ที่ค้น:</b>
          ${coverage.map(c => c.shown
            ? `<span class="inline-block m-0.5 px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">✓ ${esc(c.brand)}</span>`
            : `<span class="inline-block m-0.5 px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 border border-slate-200" title="ไม่พบสินค้าที่ยืนยันได้">– ${esc(c.brand)}</span>`).join("")}
        </div>` : "";
    }
    function warningsHtml(warnings) {
      const ws = (warnings || []).filter(w => !/^ไม่พบสินค้าที่ยืนยันได้จาก/.test(w));
      return ws.length ? `<div class="col-span-1 md:col-span-2 lg:col-span-3 bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-xl p-3">
          ${ws.map(w => "⚠️ " + esc(w)).join("<br>")}</div>` : "";
    }

    function render(items, warnings, coverage) {
      const grid = document.getElementById("comparisonGrid");
      const sorted = items.slice().sort((a, b) => b.matchScore - a.matchScore || (b.imageScore || 0) - (a.imageScore || 0));
      document.getElementById("resultCount").innerText =
        `พบ ${sorted.length}/${(coverage || []).length || sorted.length} แบรนด์ (แบรนด์ละ 1 รุ่นที่ใกล้ที่สุด)`;
      const more = (coverage || []).length ? `
        <div class="col-span-1 md:col-span-2 lg:col-span-3 bg-white border border-slate-200 rounded-xl p-3 text-xs text-slate-600">
          <b>แบรนด์ที่ค้น:</b>
          ${coverage.map(c => c.shown
            ? `<span class="inline-block m-0.5 px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">✓ ${esc(c.brand)}</span>`
            : `<span class="inline-block m-0.5 px-2 py-0.5 rounded-full bg-slate-100 text-slate-400 border border-slate-200" title="ไม่พบสินค้าที่ยืนยันได้">– ${esc(c.brand)}</span>`).join("")}
        </div>` : "";
      const warn = warnings.length ? `
        <div class="col-span-1 md:col-span-2 lg:col-span-3 bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-xl p-3">
          ${warnings.map(w => "⚠️ " + esc(w)).join("<br>")}
        </div>` : "";
      const empty = !sorted.length
        ? `<div class="col-span-3 text-center py-10 text-slate-500">ไม่พบรายการสินค้าที่ยืนยันได้จากเว็บแบรนด์</div>` : "";
      grid.innerHTML = sorted.map(cardHtml).join("") + empty + more;
      // ไม่ต้องแสดงบรรทัด "ไม่พบจาก ..." ซ้ำ เพราะมีแถบแบรนด์แล้ว
      if (warn && warnings.some(w => !/^ไม่พบสินค้าที่ยืนยันได้จาก/.test(w)))
        grid.innerHTML += `<div class="col-span-1 md:col-span-2 lg:col-span-3 bg-amber-50 border border-amber-200 text-amber-900 text-xs rounded-xl p-3">
          ${warnings.filter(w => !/^ไม่พบสินค้าที่ยืนยันได้จาก/.test(w)).map(w => "⚠️ " + esc(w)).join("<br>")}</div>`;
    }

    async function executeRealSearch() {
      const typed = document.getElementById("searchInput").value.trim();
      // มีรูปแต่ไม่พิมพ์ → ส่งข้อความว่าง ให้ระบบใช้รูปเป็นหลัก (ไม่เติมคำให้เอง)
      const textQuery = typed || (selectedBase64Image ? "" : "ชุดชั้นใน Seamless");
      const section = document.getElementById("comparisonSection");
      const grid = document.getElementById("comparisonGrid");
      const keywordLabel = document.getElementById("searchKeywordLabel");
      const seq = ++searchSeq;

      if (!GAS_API_URL || GAS_API_URL.includes("YOUR_DEPLOYMENT_ID")) {
        alert("กรุณาใส่ Web App URL จาก Google Apps Script ในตัวแปร GAS_API_URL ก่อนใช้งานนะครับ");
        return;
      }

      section.classList.remove("hidden");
      keywordLabel.innerText = selectedBase64Image
        ? (textQuery ? `ค้นหาด้วยรูปภาพ (หลัก) + คำค้นหา: "${textQuery}"` : "ค้นหาด้วยรูปภาพ")
        : `กำลังค้นหาข้อมูลสำหรับ: "${textQuery}"`;
      document.getElementById("resultCount").innerText = "กำลังค้นหา…";
      grid.innerHTML = `
        <div class="col-span-1 md:col-span-3 text-center py-16 bg-white rounded-2xl border border-slate-200">
          <div class="inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
          <p class="text-slate-600 font-medium text-sm">กำลังค้นหาสินค้าใกล้เคียงจาก 12 แบรนด์คู่แข่ง</p>
          <p id="progressText" class="text-slate-400 text-xs mt-1">เริ่มค้นหา…</p>
        </div>`;

      const t0 = Date.now();
      const key = cacheKey(textQuery, selectedBase64Image);
      const cachedResult = cacheGet(key);
      // ข้อความความคืบหน้า + ตัวจับเวลา ระหว่างรอ
      const steps = [[0, "วิเคราะห์รูปและค้นเว็บ…"], [6, "ดึงแคตตาล็อก Sabina / B'me / Triumph / Wienna / BSC / Uniqlo…"],
                     [12, "โหลดรูปสินค้าคู่แข่ง…"], [16, "Gemini กำลังเทียบรูปทีละแบรนด์…"], [30, "ใกล้เสร็จแล้ว…"]];
      const timer = cachedResult ? null : setInterval(() => {
        const sec = Math.floor((Date.now() - t0) / 1000);
        const el = document.getElementById("progressText");
        if (!el || seq !== searchSeq) return clearInterval(timer);
        el.textContent = steps.filter(s => sec >= s[0]).pop()[1] + " (" + sec + " วินาที)";
      }, 500);
      try {
        const r = cachedResult || await callApi({ query: textQuery, image: selectedBase64Image });
        if (timer) clearInterval(timer);
        if (seq !== searchSeq) return;
        if (!cachedResult) cacheSet(key, r);
        const ref = r.reference;
        if (ref) keywordLabel.innerText = `สินค้าอ้างอิง: ${ref.summary || textQuery}` +
          (ref.features && ref.features.length ? ` · ${ref.features.join(" · ")}` : "");
        renderResult(r);
      } catch (error) {
        if (timer) clearInterval(timer);
        if (seq !== searchSeq) return;
        console.error("Search error:", error);
        grid.innerHTML = `
          <div class="col-span-1 md:col-span-3 text-center py-10 bg-rose-50 text-rose-700 rounded-2xl border border-rose-200 p-4">
            <p class="font-bold">เกิดข้อผิดพลาดในการค้นหา</p>
            <p class="text-xs mt-1">${esc(error.message)}</p>
          </div>`;
        document.getElementById("resultCount").innerText = "พบ 0 รายการ";
        return;
      }
      console.log("ใช้เวลาค้นหา", ((Date.now() - t0) / 1000).toFixed(1), "วินาที", cachedResult ? "(จากแคชในเบราว์เซอร์)" : "");
    }
  </script>
</body>
</html>
